[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lopdf = "0.45"
pdfium-render = { version = "0.9", features = ["thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
similar = "2"
thiserror = "2"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
roxmltree = "0.20"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
rfd = "0.17"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
md-5 = "0.11"
libc = "0.2"
x509-cert = "0.2"
p12-keystore = "0.4"
ureq = "3"
base64 = "0.22"
ocrs = "0.13"
rten = "0.26"

# Dependencies (image, OCR inference, crypto) are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
