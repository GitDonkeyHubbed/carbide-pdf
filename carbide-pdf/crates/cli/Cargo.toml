[package]
name = "carbide-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line tool for Carbide PDF (the carbide binary)."
readme = "../../README.md"

[[bin]]
name = "carbide"
path = "src/main.rs"

[dependencies]
carbide-engine = { path = "../engine" }
clap.workspace = true
base64.workspace = true
chrono.workspace = true

[dev-dependencies]
# Tests sign files with certificates of their own to check what `verify` reports.
rcgen = "0.14"
rand = "0.8"
rsa.workspace = true
