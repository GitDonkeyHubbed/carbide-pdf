name: assemble scrub

on:
  push:
    branches:
      - fix/indirect-kids-resources
    paths:
      - .github/workflows/assemble-scrub.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: fix/indirect-kids-resources
          persist-credentials: true

      - name: Assemble the verified source and stop if the bytes differ
        run: |
          set -euo pipefail
          cat \
            carbide-pdf/upload-check/part-00.rs \
            carbide-pdf/upload-check/part-01.rs \
            carbide-pdf/upload-check/part-02.rs \
            carbide-pdf/upload-check/part-03.rs \
            carbide-pdf/upload-check/part-04.rs \
            carbide-pdf/upload-check/part-05.rs \
            carbide-pdf/upload-check/part-06.rs \
            > carbide-pdf/crates/engine/src/scrub.rs
          cp carbide-pdf/upload-check/indirect_kids_resources.rs \
            carbide-pdf/crates/engine/tests/indirect_kids_resources.rs
          echo "b19a26d0cee6da42d33574dfdfc12a37746410d1cf69d0d3dc529d0c40fcaf1f  carbide-pdf/crates/engine/src/scrub.rs" | sha256sum -c -
          echo "0363fc4948e1f226938e3ff707a71e8c0ea4ad5ad3c577c323d6e4541abc84d6  carbide-pdf/crates/engine/tests/indirect_kids_resources.rs" | sha256sum -c -
          rm -rf carbide-pdf/upload-check
          rm -f .github/workflows/assemble-scrub.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: follow an indirect Kids array when dropping a deleted page's resources" -m "A page tree may store /Kids as a reference to its array. Opening a sound tree leaves that reference in place. The resource trim walked only a direct array, so a branch below the reference kept the images a deleted page drew, and saving the file still contained them."
          git push origin HEAD:fix/indirect-kids-resources
